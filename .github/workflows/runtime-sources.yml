name: Runtime source completeness

on:
  pull_request:
  push:
    branches:
      - main
      - bootstrap-v0.1

permissions:
  contents: read

jobs:
  validate-runtime-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate complete Linux Android and Darwin source inventory
        run: python scripts/check-runtime-sources.py
      - name: Validate per-family source closure locks
        run: python scripts/check-runtime-source-locks.py
      - name: Compile source tooling
        run: python -m py_compile scripts/check-runtime-sources.py scripts/check-runtime-source-locks.py scripts/sync-runtime-source-closure.py
      - name: Dry-run pinned Android source synchronization
        run: python scripts/sync-runtime-source-closure.py android --dest "$RUNNER_TEMP/runtime-sources" --dry-run
      - name: Dry-run pinned Apple OSS synchronization
        run: python scripts/sync-runtime-source-closure.py darwin-apple-oss --dest "$RUNNER_TEMP/runtime-sources" --dry-run
      - name: Test runtime source completeness contract
        run: cargo test -p aw-runtime-sources --locked
      - name: Test release admission binding
        run: cargo test -p aw-app-compat --locked
