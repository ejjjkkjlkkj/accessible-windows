name: uefi-screenreader-core-v2-ci

on:
  push:
    branches: [uefi-screenreader-core-v2-20260922]
    paths:
      - 'boot/uefi-screenreader-core-v1/**'
      - '.github/workflows/uefi-screenreader-core-v1-ci.yml'
  workflow_dispatch:

concurrency:
  group: uefi-screenreader-core-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prove golden boot path untouched
        run: |
          set -euo pipefail
          git diff --exit-code 9cd02dc7db3ab728aba024ecca2a2e5801014007..HEAD --             boot/uefi-hii-graph-prompt-speech-v1             scripts/build-uefi-screenreader-usb-image.sh
          echo UEFI_GOLDEN_BOOT_PATH_UNTOUCHED=PASS

      - name: Compile freestanding core
        run: |
          set -euo pipefail
          root=boot/uefi-screenreader-core-v1
          clang -std=c11 -ffreestanding -fno-builtin -fno-stack-protector -mno-red-zone             -O2 -Wall -Wextra -Werror -pedantic             -c "$root/screenreader_core.c" -o "$root/screenreader_core.o"
          clang -std=c11 -ffreestanding -fno-builtin -fno-stack-protector -mno-red-zone             -O2 -Wall -Wextra -Werror -pedantic             -c "$root/hii_adapter.c" -o "$root/hii_adapter.o"
          clang -std=c11 -ffreestanding -fno-builtin -fno-stack-protector -mno-red-zone             -O2 -Wall -Wextra -Werror -pedantic             -c "$root/screenreader_session.c" -o "$root/screenreader_session.o"
          clang -std=c11 -ffreestanding -fno-builtin -fno-stack-protector -mno-red-zone             -O2 -Wall -Wextra -Werror -pedantic             -c "$root/legacy_bridge.c" -o "$root/legacy_bridge.o"
          clang -std=c11 -ffreestanding -fno-builtin -fno-stack-protector -mno-red-zone             -O2 -Wall -Wextra -Werror -pedantic             -c "$root/legacy_session_adapter.c" -o "$root/legacy_session_adapter.o"
          clang -std=c11 -ffreestanding -fno-builtin -fno-stack-protector -mno-red-zone             -O2 -Wall -Wextra -Werror -pedantic             -c "$root/ifr_collector.c" -o "$root/ifr_collector.o"
          test -s "$root/screenreader_core.o"
          test -s "$root/hii_adapter.o"
          test -s "$root/screenreader_session.o"
          test -s "$root/legacy_bridge.o"
          test -s "$root/legacy_session_adapter.o"
          test -s "$root/ifr_collector.o"
          echo UEFI_SCREENREADER_FREESTANDING_BUILD=PASS

      - name: Run behavior tests with sanitizers
        run: |
          set -euo pipefail
          root=boot/uefi-screenreader-core-v1
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             "$root/screenreader_core.c" "$root/screenreader_core_test.c"             -o "$root/screenreader_core_test"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1             "$root/screenreader_core_test"
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             "$root/screenreader_core.c" "$root/hii_adapter.c" "$root/hii_adapter_test.c"             -o "$root/hii_adapter_test"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1             "$root/hii_adapter_test"
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             "$root/screenreader_core.c" "$root/hii_adapter.c" "$root/screenreader_session.c" "$root/screenreader_session_test.c"             -o "$root/screenreader_session_test"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1             "$root/screenreader_session_test"
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             "$root/screenreader_core.c" "$root/hii_adapter.c" "$root/legacy_bridge.c" "$root/legacy_bridge_test.c"             -o "$root/legacy_bridge_test"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1             "$root/legacy_bridge_test"
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             "$root/screenreader_core.c" "$root/hii_adapter.c" "$root/screenreader_session.c" "$root/legacy_bridge.c" "$root/legacy_session_adapter.c" "$root/legacy_session_adapter_test.c"             -o "$root/legacy_session_adapter_test"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1             "$root/legacy_session_adapter_test"
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             "$root/screenreader_core.c" "$root/hii_adapter.c" "$root/legacy_bridge.c" "$root/ifr_collector.c" "$root/ifr_collector_test.c"             -o "$root/ifr_collector_test"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1             "$root/ifr_collector_test"
          echo UEFI_SCREENREADER_SANITIZERS=PASS

      - name: Static analyzer
        run: |
          set -euo pipefail
          root=boot/uefi-screenreader-core-v1
          clang --analyze -std=c11 -Wall -Wextra -Werror             "$root/screenreader_core.c"
          clang --analyze -std=c11 -Wall -Wextra -Werror             "$root/hii_adapter.c"
          clang --analyze -std=c11 -Wall -Wextra -Werror             "$root/screenreader_session.c"
          clang --analyze -std=c11 -Wall -Wextra -Werror             "$root/legacy_bridge.c"
          clang --analyze -std=c11 -Wall -Wextra -Werror             "$root/legacy_session_adapter.c"
          clang --analyze -std=c11 -Wall -Wextra -Werror             "$root/ifr_collector.c"
          echo UEFI_SCREENREADER_STATIC_ANALYSIS=PASS


  uefi-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install UEFI runtime toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-x86 ovmf

      - name: Cross-link V2 as EFI application
        run: |
          set -euo pipefail
          root=boot/uefi-screenreader-core-v1
          flags='--target=x86_64-pc-windows-msvc -ffreestanding -fshort-wchar -fno-stack-protector -fno-builtin -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          for src in screenreader_core hii_adapter screenreader_session legacy_bridge legacy_session_adapter ifr_collector uefi_core_v2_smoke; do
            clang $flags -c "$root/$src.c" -o "$root/$src.efi.obj"
          done
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 \
            /out:"$root/CORE-V2.EFI" \
            "$root/screenreader_core.efi.obj" \
            "$root/hii_adapter.efi.obj" \
            "$root/screenreader_session.efi.obj" \
            "$root/legacy_bridge.efi.obj" \
            "$root/legacy_session_adapter.efi.obj" \
            "$root/ifr_collector.efi.obj" \
            "$root/uefi_core_v2_smoke.efi.obj"
          test -s "$root/CORE-V2.EFI"
          grep -aF 'UEFI_CORE_V2_RUNTIME=PASS' "$root/CORE-V2.EFI"
          echo UEFI_CORE_V2_LINK=PASS

      - name: Boot V2 under OVMF
        run: |
          set -euo pipefail
          root=boot/uefi-screenreader-core-v1
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if test -f "$code" -a -f "$vars"; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          cp "$VARS" "$root/core-v2-vars.fd"
          rm -rf "$root/core-v2-esp"
          mkdir -p "$root/core-v2-esp/EFI/BOOT"
          cp "$root/CORE-V2.EFI" "$root/core-v2-esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/core-v2.serial"

          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 128M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/core-v2-vars.fd" \
            -drive format=raw,file=fat:rw:"$root/core-v2-esp" \
            -display none -monitor none -serial file:"$root/core-v2.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill $qpid 2>/dev/null || true' EXIT

          ROOT="$root" python - <<'PY'
          from pathlib import Path
          import os,time
          root=Path(os.environ['ROOT'])
          p=root/'core-v2.serial'
          required=[
              b'UEFI_CORE_V2_BOOT=PASS\r\n',
              b'UEFI_CORE_V2_HII_BUILD=PASS\r\n',
              b'UEFI_CORE_V2_INITIAL_FOCUS=PASS\r\n',
              b'UEFI_CORE_V2_NAVIGATION=PASS\r\n',
              b'UEFI_CORE_V2_CHOOSER_OPEN=PASS\r\n',
              b'UEFI_CORE_V2_CHOOSER_FILTER=PASS\r\n',
              b'UEFI_CORE_V2_CHOOSER_SELECT=PASS\r\n',
              b'UEFI_CORE_V2_EXIT=PASS\r\n',
              b'UEFI_CORE_V2_RUNTIME=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+45
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('V2 firmware blocked: '+repr(raw[-12000:]))
              if all(marker in raw for marker in required):
                  print('UEFI_CORE_V2_OVMF_RUNTIME=PASS')
                  break
              time.sleep(.05)
          else:
              raise SystemExit('V2 OVMF timeout: '+repr((p.read_bytes() if p.exists() else b'')[-12000:]))
          PY
