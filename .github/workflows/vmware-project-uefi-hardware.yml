name: vmware-project-uefi-hardware-psexec

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vmware-project-uefi-hardware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmware-project-uefi-hardware-psexec
  cancel-in-progress: true

jobs:
  physical-psexec-voice:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25

    steps:
      - name: Checkout project under test
        uses: actions/checkout@v5
        with:
          repository: ejjjkkjlkkj/project
          ref: f417e84c101b882bbb4d142d80ff7f5d62a50cc3
          path: project

      - name: Execute physical voice and VMware pipeline via required PsExec
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $psexec = 'C:\Users\adm\Downloads\PsExec64.exe'
          if (-not (Test-Path -LiteralPath $psexec)) {
            throw "Required PsExec64.exe missing: $psexec"
          }

          # Use the Windows session that already hosts the manually opened
          # self-hosted runner. explorer.exe is not a reliable session oracle.
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -le 0) {
            throw "Runner is not attached to an interactive Windows session (SessionId=$sessionId)."
          }

          # Prove PsExec can enter that exact desktop session as LocalSystem.
          # Interactive PsExec does not reliably pipe child stdout back to the
          # runner, so persist the proof to a local file and validate it here.
          $probeScript = 'C:\Windows\Temp\qev-psexec-interactive-probe.ps1'
          $probeFile = 'C:\Windows\Temp\qev-psexec-interactive-proof.txt'
          Remove-Item -LiteralPath $probeFile -Force -ErrorAction SilentlyContinue
          @'
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $session = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Set-Content -LiteralPath 'C:\Windows\Temp\qev-psexec-interactive-proof.txt' -Value "$sid|$session" -Encoding ascii
          exit 0
          '@ | Set-Content -LiteralPath $probeScript -Encoding utf8

          & $psexec -accepteula -nobanner -s -h -i $sessionId powershell.exe -NoProfile -ExecutionPolicy Bypass -File $probeScript
          if ($LASTEXITCODE -ne 0) {
            throw "PsExec interactive SYSTEM validation failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $probeFile)) {
            throw "PsExec interactive proof file was not created."
          }
          $expected = "S-1-5-18|$sessionId"
          $probeLine = (Get-Content -Raw -LiteralPath $probeFile).Trim()
          if ($probeLine -ne $expected) {
            throw "PsExec did not enter runner session as LocalSystem. Expected $expected, got $probeLine."
          }

          Write-Host "PSEXEC_PATH=$psexec"
          Write-Host "RUNNER_INTERACTIVE_SESSION=$sessionId"
          Write-Host "PSEXEC_INTERACTIVE_SYSTEM=PASS"

          $workspace = (Resolve-Path -LiteralPath '.\project').Path
          $stage = Join-Path $workspace 'navigation\uefi\psexec_vmware_voice_test.ps1'
          if (-not (Test-Path -LiteralPath $stage)) {
            throw "Project PsExec stage missing: $stage"
          }

          $args = @(
            '-accepteula',
            '-nobanner',
            '-s',
            '-h',
            '-i',
            "$sessionId",
            'powershell.exe',
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            $stage,
            '-Workspace',
            $workspace,
            '-RunId',
            $env:GITHUB_RUN_ID
          )
          & $psexec @args
          if ($LASTEXITCODE -ne 0) {
            $stageLog = 'C:\Windows\Temp\qev-psexec-pipeline-stage.txt'
            $errorLog = 'C:\Windows\Temp\qev-psexec-pipeline-error.txt'
            if (Test-Path -LiteralPath $stageLog) {
              Write-Host '--- PSEXEC STAGE LOG ---'
              Get-Content -LiteralPath $stageLog
            }
            if (Test-Path -LiteralPath $errorLog) {
              Write-Host '--- PSEXEC ERROR LOG ---'
              Get-Content -LiteralPath $errorLog
            }
            throw "PsExec physical pipeline failed with exit code $LASTEXITCODE"
          }

          $summary = Join-Path $workspace 'build\psexec-physical-summary.txt'
          if (-not (Test-Path -LiteralPath $summary)) {
            throw "Missing PsExec physical summary"
          }
          $summaryText = Get-Content -Raw -LiteralPath $summary
          foreach ($required in @(
            'PSEXEC_REQUIRED=PASS',
            'PSEXEC64_PATH=C:\Users\adm\Downloads\PsExec64.exe',
            'IDENTITY_SID=S-1-5-18',
            'REAL_WINDOWS_VOICE_BUILD=PASS',
            'REAL_WINDOWS_VOICE_BANK_COMPLETE=PASS',
            'VOICE_CODEC_ROUNDTRIP=PASS',
            'NAVIGATION_EFI_REAL_VOICE_BUILD=PASS',
            'VMWARE_UEFI_BOOT=PASS',
            'VMWARE_SCREENREADER_DISCOVERY=PASS',
            'SYSTEM_SPEECH_OUTPUT_RATE=24000'
          )) {
            if ($summaryText -notmatch [regex]::Escape($required)) {
              throw "Missing required physical proof marker: $required"
            }
          }
          Get-Content -LiteralPath $summary
          Write-Host 'WINDOWS_PROJECT_EXECUTION_VIA_PSEXEC=PASS'

      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psexec-project-uefi-physical-evidence
          path: |
            project/build/NAVIGATION.EFI
            project/build/navigation_units.txt
            project/build/host-evidence.txt
            project/build/psexec-physical-summary.txt
            project/build/system-voice/system-voice-evidence.txt
            project/build/system-voice/quality_reference.wav
            project/build/quality-reference-firmware-roundtrip.wav
            project/build/quality-reference-firmware-roundtrip.json
            project/build/vmware-smoke-*/serial.log
            project/build/vmware-smoke-*/serial-final.txt
            project/build/vmware-smoke-*/vmware.log
            project/build/vmware-smoke-*/*.vmx
            project/build/vmware-smoke-*/uefi-floppy.img
          if-no-files-found: warn
