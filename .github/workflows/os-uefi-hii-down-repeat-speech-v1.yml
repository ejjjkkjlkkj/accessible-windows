name: os-uefi-hii-down-repeat-speech-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py'
      - 'boot/uefi-hii-down-speech-v1/os-uefi-hii-down-speech-v1.labproof'
      - 'boot/uefi-hii-repeat-speech-v1/os-uefi-hii-repeat-speech-v1.labproof'
      - 'boot/uefi-hii-down-repeat-speech-v1/os-uefi-hii-down-repeat-speech-v1.labproof'
      - '.github/workflows/os-uefi-hii-down-repeat-speech-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-native-down-repeat-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce proven foundations
        shell: python
        run: |
          from pathlib import Path
          for path, required in [
              ('boot/uefi-hii-down-speech-v1/os-uefi-hii-down-speech-v1.labproof', [
                  'proof = PASS',
                  'proof-down-key-event = PASS',
                  'proof-focus-option-label = Enabled',
                  'proof-focus-native-HDA-speech = PASS',
                  'proof-setting-mutation = false',
              ]),
              ('boot/uefi-hii-repeat-speech-v1/os-uefi-hii-repeat-speech-v1.labproof', [
                  'proof = PASS',
                  'proof-repeat-key-event = PASS',
                  'proof-post-key-native-HDA-speech = PASS',
                  'proof-setting-mutation = false',
              ]),
          ]:
              lines=set(Path(path).read_text().splitlines())
              for line in required:
                  assert line in lines,(path,line)
          print('DOWN_REPEAT_FOUNDATIONS=PASS')

      - name: Audit two-key source contract
        shell: python
        run: |
          from pathlib import Path
          import ast,re
          src=Path('boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py').read_text()
          ast.parse(src)
          labels=re.findall(r"c\.label\('([^']+)'\)",src)
          duplicates=sorted({x for x in labels if labels.count(x)>1})
          assert not duplicates,duplicates
          for token in [
              'WAIT_REPEAT_KEY=False',
              'WAIT_DOWN_SPEAK=False',
              "'--wait-down-repeat-speak'",
              "WAIT_DOWN_SPEAK=True; WAIT_REPEAT_KEY=True",
              'HII_NAVIGATION_KEY=WAIT_DOWN',
              'ACCESSIBILITY_REPEAT_KEY=WAIT_R',
              'NAV_FOCUS_OPTION_TEXT=',
              'NAV_FOCUS_SPOKEN_PREFIX=',
              'NAV_FOCUS_SPEECH_HDA=PASS',
              "'conin_ptr':504",
          ]:
              assert token in src,token
          assert "c.emit(b'\\x48\\x8b\\x6a\\x30')" not in src
          proof=set(Path('boot/uefi-hii-down-repeat-speech-v1/os-uefi-hii-down-repeat-speech-v1.labproof').read_text().splitlines())
          for line in [
              'first-key = SCAN_DOWN 0x0002',
              'second-key = Unicode R or r',
              'focus-operation = read-only',
              'route-config-call = forbidden',
              'set-variable-call = forbidden',
              'varstore-write = forbidden',
              'firmware-setting-mutation = forbidden',
          ]:
              assert line in proof,line
          print('DOWN_REPEAT_SOURCE_CONTRACT=PASS')

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Build deterministic two-key EFI and verifier
        shell: bash
        run: |
          set -euo pipefail
          src=boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py
          root=boot/uefi-hii-down-repeat-speech-v1
          python "$src" "$root/BOOTX64.EFI" --wait-down-repeat-speak | tee "$root/build.log"
          python "$src" "$root/BOOTX64-2.EFI" --wait-down-repeat-speak > "$root/build2.log"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          python "$src" "$root/BOOTX64-VERIFY.EFI" > "$root/verify-build.log"
          grep -F 'hii-down-repeat-speak=enabled' "$root/build.log"
          grep -F 'accessibility-repeat-key=enabled' "$root/build.log"
          grep -F 'hii-down-speak=enabled' "$root/build.log"
          sha256sum "$root/BOOTX64.EFI" "$root/BOOTX64-VERIFY.EFI"

      - name: Audit PE and two-key witnesses
        shell: python
        run: |
          from pathlib import Path
          import struct
          image=Path('boot/uefi-hii-down-repeat-speech-v1/BOOTX64.EFI').read_bytes()
          assert image[:2]==b'MZ'
          pe=struct.unpack_from('<I',image,0x3c)[0]
          assert image[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<HH',image,coff)==(0x8664,3)
          opt=coff+20
          assert struct.unpack_from('<H',image,opt)[0]==0x20b
          assert struct.unpack_from('<H',image,opt+0x44)[0]==10
          sec=opt+0xf0; ds=sec+40
          assert not(struct.unpack_from('<I',image,sec+0x24)[0]&0x80000000)
          dc=struct.unpack_from('<I',image,ds+0x24)[0]
          assert dc&0x80000000 and not(dc&0x20000000)
          for token in [
              b'HII_NAVIGATION_KEY=WAIT_DOWN\r\n',
              b'HII_NAVIGATION_KEY=DOWN\r\n',
              b'ACCESSIBILITY_REPEAT_KEY=WAIT_R\r\n',
              b'ACCESSIBILITY_REPEAT_KEY=R\r\n',
              b'NAV_NEXT_OPTION_DIRECT_CHILD=PASS\r\n',
              b'NAV_FOCUS_OPTION_TEXT=',
              b'NAV_FOCUS_SPOKEN_PREFIX=',
              b'NAV_FOCUS_SPEECH_HDA=PASS\r\n',
          ]:
              assert token in image,token
          print('DOWN_REPEAT_STATIC=PASS')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        shell: bash
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hii-down-repeat-speech-v1/ovmf.env

      - name: Prove DOWN focus then R speech gate
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-down-repeat-speech-v1
          source "$root/ovmf.env"
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/two-key.serial" "$root/two-key.wav" "$root/qmp.sock" "$root/runtime.txt"

          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 192M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -audiodev wav,id=aud,path="$root/two-key.wav",out.frequency=48000,out.channels=2 \
            -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
            -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
            -display none -monitor none \
            -qmp unix:"$root/qmp.sock",server=on,wait=off \
            -serial file:"$root/two-key.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import json,re,socket,time
          root=Path('boot/uefi-hii-down-repeat-speech-v1')
          serial=root/'two-key.serial'; qmp=root/'qmp.sock'

          def read():
              return serial.read_bytes() if serial.exists() else b''
          def wait_for(token, seconds=35, label='token'):
              end=time.time()+seconds
              while time.time()<end:
                  raw=read()
                  if b'STATUS=BLOCKED\r\n' in raw:
                      raise SystemExit(f'blocked while waiting {label}: '+repr(raw[-20000:]))
                  if token in raw:
                      return raw
                  time.sleep(.1)
              raise SystemExit(f'timeout waiting {label}: '+repr(read()[-20000:]))

          raw=wait_for(b'HII_NAVIGATION_KEY=WAIT_DOWN\r\n',label='DOWN gate')
          assert b'HDA_CONTROLLER_CODEC=PASS\r\n' not in raw
          assert b'NAV_FOCUS_SPEECH_HDA=PASS\r\n' not in raw

          end=time.time()+10
          while time.time()<end and not qmp.exists(): time.sleep(.05)
          if not qmp.exists(): raise SystemExit('QMP socket missing')

          with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as s:
              s.connect(str(qmp)); f=s.makefile('rwb',buffering=0)
              greeting=json.loads(f.readline()); assert 'QMP' in greeting
              f.write((json.dumps({'execute':'qmp_capabilities'})+'\r\n').encode())
              while True:
                  m=json.loads(f.readline())
                  if 'return' in m: break

              def send_key(qcode):
                  f.write((json.dumps({'execute':'send-key','arguments':{'keys':[{'type':'qcode','data':qcode}],'hold-time':50}})+'\r\n').encode())
                  while True:
                      m=json.loads(f.readline())
                      if 'return' in m: return
                      if 'error' in m: raise SystemExit(repr(m))

              send_key('down')
              raw=wait_for(b'ACCESSIBILITY_REPEAT_KEY=WAIT_R\r\n',label='R gate')
              assert b'HII_NAVIGATION_KEY=DOWN\r\n' in raw
              assert b'HII_NAVIGATION_KEY=PASS\r\n' in raw
              assert b'NAV_NEXT_OPTION_DIRECT_CHILD=PASS\r\n' in raw
              assert b'NAV_FOCUS_OPTION_TEXT=Enabled\r\n' in raw
              assert b'NAV_FOCUS_SPOKEN_PREFIX=enabled\r\n' in raw
              assert b'HDA_CONTROLLER_CODEC=PASS\r\n' not in raw
              assert b'NAV_FOCUS_SPEECH_HDA=PASS\r\n' not in raw
              assert b'STATUS=PASS\r\n' not in raw
              print('DOWN_MOVED_FOCUS_WITHOUT_HDA=PASS')

              send_key('r')

          required=[
              b'ACCESSIBILITY_REPEAT_KEY=R\r\n',
              b'ACCESSIBILITY_REPEAT_KEY=PASS\r\n',
              b'NAV_FOCUS_OPTION_STRING=PASS\r\n',
              b'NAV_FOCUS_LABEL_BINDING=PASS\r\n',
              b'NAV_FOCUS_SOURCE=PASS\r\n',
              b'NAV_FOCUS_SPOKEN_PREFIX=PASS\r\n',
              b'LPIB_PROGRESS=PASS\r\n',
              b'NAV_FOCUS_SPEECH_HDA=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+35
          while time.time()<end:
              raw=read()
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('blocked after R: '+repr(raw[-20000:]))
              if all(x in raw for x in required):
                  cur=re.search(br'CURRENT_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  sel=re.search(br'SELECTED_OPTION_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  nav=re.search(br'NAV_NEXT_OPTION_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  label=re.search(br'NAV_FOCUS_OPTION_TEXT=([^\r\n]+)',raw)
                  spoken=re.search(br'NAV_FOCUS_SPOKEN_PREFIX=([a-z]{1,8})\r\nNAV_FOCUS_SPOKEN_PREFIX=PASS\r\n',raw)
                  assert all([cur,sel,nav,label,spoken]),raw[-20000:]
                  current=bytes.fromhex(cur.group(1).decode())[0]
                  selected=bytes.fromhex(sel.group(1).decode())[0]
                  focus_value=bytes.fromhex(nav.group(1).decode())[0]
                  focus_label=label.group(1).decode('ascii','replace').strip()
                  prefix=spoken.group(1).decode()
                  assert (current,selected,focus_value)==(0,0,1),(current,selected,focus_value)
                  assert focus_label=='Enabled',focus_label
                  assert prefix=='enabled',prefix
                  root.joinpath('runtime.txt').write_text(
                      'first-key = DOWN\n'
                      'second-key = R\n'
                      f'current-value = {current}\n'
                      'current-option-label = Disabled\n'
                      f'focus-option-value = {focus_value}\n'
                      f'focus-option-label = {focus_label}\n'
                      f'focus-spoken-prefix = {prefix}\n'
                      'pre-R-native-hda-speech = false\n'
                      'post-R-native-hda-speech = PASS\n'
                  )
                  print('DOWN_REPEAT_SPEECH_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout final speech: '+repr(read()[-20000:]))
          PY

          sleep 1
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          trap - EXIT

      - name: Validate post-R focused speech waveform
        shell: python
        run: |
          from pathlib import Path
          import hashlib,struct,wave
          root=Path('boot/uefi-hii-down-repeat-speech-v1')
          p=root/'two-key.wav'
          assert p.exists() and p.stat().st_size>10000,p
          with wave.open(str(p),'rb') as w:
              channels=w.getnchannels(); rate=w.getframerate(); width=w.getsampwidth()
              frames=w.getnframes(); raw=w.readframes(frames)
          assert (channels,rate,width)==(2,48000,2),(channels,rate,width)
          vals=struct.unpack('<'+'h'*(len(raw)//2),raw)
          peak=max(abs(v) for v in vals); active=sum(abs(v)>=500 for v in vals)
          assert peak>=5000,peak
          assert active>=3000,active
          (root/'metrics.txt').write_text(
              f'frames={frames}\npeak={peak}\nactive={active}\n'
              f'wav-sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\n'
          )
          print('DOWN_REPEAT_WAVEFORM=PASS')

      - name: Reboot same VARS and prove setting stayed Disabled
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-down-repeat-speech-v1
          source "$root/ovmf.env"
          cp "$root/BOOTX64-VERIFY.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/post.serial" "$root/post.wav"
          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 192M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -audiodev wav,id=aud,path="$root/post.wav",out.frequency=48000,out.channels=2 \
            -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
            -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
            -display none -monitor none -serial file:"$root/post.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true' EXIT
          python - <<'PY'
          from pathlib import Path
          import re,time
          p=Path('boot/uefi-hii-down-repeat-speech-v1/post.serial')
          end=time.time()+35
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('post-state blocked: '+repr(raw[-20000:]))
              if b'STATUS=PASS\r\n' in raw:
                  cur=re.search(br'CURRENT_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  label=re.search(br'SELECTED_OPTION_TEXT=([^\r\n]+)',raw)
                  assert cur and label
                  assert bytes.fromhex(cur.group(1).decode())[0]==0
                  assert label.group(1).decode('ascii','replace').strip()=='Disabled'
                  print('DOWN_REPEAT_POST_STATE_UNCHANGED=PASS')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout post-state')
          PY
          sleep 1
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          trap - EXIT

      - name: Record evidence
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-down-repeat-speech-v1
          sha256sum "$root/BOOTX64.EFI" "$root/BOOTX64-VERIFY.EFI" "$root/two-key.serial" "$root/two-key.wav" "$root/post.serial" "$root/runtime.txt" "$root/metrics.txt" > "$root/evidence.sha256"
          {
            echo 'OS-UEFI-HII-DOWN-REPEAT-SPEECH-V1'
            cat "$root/runtime.txt"
            echo 'post-state-current-value = 0'
            echo 'post-state-current-label = Disabled'
            echo 'setting-mutation = false'
            echo 'physical-ASUS-two-key-focus-repeat = not-established'
            echo 'result = PASS'
          } > "$root/linux-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hii-down-repeat-speech-v1-linux
          path: |
            boot/uefi-hii-down-repeat-speech-v1/BOOTX64.EFI
            boot/uefi-hii-down-repeat-speech-v1/BOOTX64-VERIFY.EFI
            boot/uefi-hii-down-repeat-speech-v1/two-key.serial
            boot/uefi-hii-down-repeat-speech-v1/two-key.wav
            boot/uefi-hii-down-repeat-speech-v1/post.serial
            boot/uefi-hii-down-repeat-speech-v1/runtime.txt
            boot/uefi-hii-down-repeat-speech-v1/metrics.txt
            boot/uefi-hii-down-repeat-speech-v1/evidence.sha256
            boot/uefi-hii-down-repeat-speech-v1/linux-evidence.txt
          if-no-files-found: error

      - name: Persist revision-bound two-key proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-down-repeat-speech-v1
          proof="$root/os-uefi-hii-down-repeat-speech-v1.labproof"
          builder=boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py
          down=boot/uefi-hii-down-speech-v1/os-uefi-hii-down-speech-v1.labproof
          repeat=boot/uefi-hii-repeat-speech-v1/os-uefi-hii-repeat-speech-v1.labproof
          workflow=.github/workflows/os-uefi-hii-down-repeat-speech-v1.yml
          tested_builder="$(git rev-parse "$GITHUB_SHA:$builder")"
          tested_down="$(git rev-parse "$GITHUB_SHA:$down")"
          tested_repeat="$(git rev-parse "$GITHUB_SHA:$repeat")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow")"
          cp "$root/BOOTX64.EFI" /tmp/down-repeat.efi
          cp "$root/two-key.serial" /tmp/down-repeat.serial
          cp "$root/two-key.wav" /tmp/down-repeat.wav
          cp "$root/post.serial" /tmp/down-repeat-post.serial
          cp "$root/runtime.txt" /tmp/down-repeat-runtime.txt
          cp "$root/metrics.txt" /tmp/down-repeat-metrics.txt

          git fetch origin os
          git checkout -B os origin/os
          for spec in \
            "$tested_builder|$builder|DOWN_REPEAT_STALE_BUILDER" \
            "$tested_down|$down|DOWN_REPEAT_STALE_DOWN" \
            "$tested_repeat|$repeat|DOWN_REPEAT_STALE_REPEAT" \
            "$tested_workflow|$workflow|DOWN_REPEAT_STALE_WORKFLOW"
          do
            IFS='|' read -r expected target msg <<< "$spec"
            [[ "$expected" == "$(git rev-parse "os:$target")" ]] || { echo "$msg=SKIP"; exit 0; }
          done

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hii-down-repeat-speech-v1')
          p=root/'os-uefi-hii-down-repeat-speech-v1.labproof'
          lines=p.read_text().splitlines()
          states=[x for x in lines if x.startswith('proof = ')]
          assert len(states)==1 and states[0] in {'proof = PENDING_CI','proof = PASS'},states
          vals={}
          for line in Path('/tmp/down-repeat-runtime.txt').read_text().splitlines():
              if ' = ' in line:
                  k,v=line.split(' = ',1); vals[k]=v
          kept=[x for x in lines if not x.startswith('proof-') and not x.startswith('proof = ')]
          efi=Path('/tmp/down-repeat.efi').read_bytes()
          serial=Path('/tmp/down-repeat.serial').read_bytes()
          wav=Path('/tmp/down-repeat.wav').read_bytes()
          post=Path('/tmp/down-repeat-post.serial').read_bytes()
          metrics=Path('/tmp/down-repeat-metrics.txt').read_text().strip().replace('\n','; ')
          text='\n'.join(kept).rstrip()+'\n'
          text += (
              "proof = PASS\n"
              f"proof-run = {os.environ['GITHUB_RUN_ID']}\n"
              f"proof-head-sha = {os.environ['GITHUB_SHA']}\n"
              "proof-down-key-event = PASS\n"
              "proof-repeat-key-event = PASS\n"
              "proof-next-direct-sibling = PASS\n"
              f"proof-current-value = {vals['current-value']}\n"
              f"proof-current-option-label = {vals['current-option-label']}\n"
              f"proof-focus-option-value = {vals['focus-option-value']}\n"
              f"proof-focus-option-label = {vals['focus-option-label']}\n"
              f"proof-focus-spoken-prefix = {vals['focus-spoken-prefix']}\n"
              "proof-pre-R-native-HDA-speech = false\n"
              "proof-post-R-native-HDA-speech = PASS\n"
              "proof-HDA-waveform = PASS\n"
              "proof-post-state-current-value = 0\n"
              "proof-post-state-current-label = Disabled\n"
              "proof-setting-mutation = false\n"
              "proof-physical-ASUS-two-key-focus-repeat = false\n"
              f"proof-wave-metrics = {metrics}\n"
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}\n"
              f"proof-serial-sha256 = {hashlib.sha256(serial).hexdigest()}\n"
              f"proof-wav-sha256 = {hashlib.sha256(wav).hexdigest()}\n"
              f"proof-post-serial-sha256 = {hashlib.sha256(post).hexdigest()}\n"
          )
          p.write_text(text)
          PY

          if git diff --quiet -- "$proof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$proof"
          git commit -m "Record UEFI DOWN then repeat speech proof [skip ci]"
          for attempt in 1 2 3; do
            if git push origin os; then exit 0; fi
            git fetch origin os
            [[ "$tested_builder" == "$(git rev-parse "origin/os:$builder")" ]] || { echo DOWN_REPEAT_STALE_BUILDER=SKIP; exit 0; }
            [[ "$tested_down" == "$(git rev-parse "origin/os:$down")" ]] || { echo DOWN_REPEAT_STALE_DOWN=SKIP; exit 0; }
            [[ "$tested_repeat" == "$(git rev-parse "origin/os:$repeat")" ]] || { echo DOWN_REPEAT_STALE_REPEAT=SKIP; exit 0; }
            [[ "$tested_workflow" == "$(git rev-parse "origin/os:$workflow")" ]] || { echo DOWN_REPEAT_STALE_WORKFLOW=SKIP; exit 0; }
            git rebase origin/os || { git rebase --abort || true; exit 1; }
          done
          exit 1
