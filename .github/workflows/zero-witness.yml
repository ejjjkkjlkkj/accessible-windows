name: Zero witness

on:
  push:
    branches: [os]
  pull_request:
    branches: [os]

permissions:
  contents: read

jobs:
  exact-bytes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify first raw machine artifact
        shell: bash
        run: |
          set -euo pipefail
          f=q0.qev0
          test "$(wc -c < "$f")" -eq 21
          test "$(sha256sum "$f" | awk '{print $1}')" = "328f07e101e984a4b4798b4e34756aae1645b4f433ad53f65e46f61c24fcd62e"
          hex="$(od -An -tx1 -v "$f" | tr -d ' \n')"
          test "$hex" = "48b85158504c414e455448c1c007483551583051c3"

  linux-runtime-witness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Execute raw bytes
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/q0w.c <<'EOF'
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/mman.h>
          typedef uint64_t (*fn0)(void);
          int main(void) {
              FILE *f=fopen("q0.qev0","rb");
              if(!f) return 10;
              unsigned char b[21];
              if(fread(b,1,21,f)!=21 || fgetc(f)!=EOF) return 11;
              fclose(f);
              void *m=mmap(NULL,21,PROT_READ|PROT_WRITE|PROT_EXEC,MAP_PRIVATE|MAP_ANONYMOUS,-1,0);
              if(m==MAP_FAILED) return 12;
              memcpy(m,b,21);
              uint64_t v=((fn0)m)();
              if(v!=UINT64_C(0x22A720A6791C70FB)) return 13;
              puts("Q0_LINUX=PASS");
              return 0;
          }
          EOF
          cc -O2 -Wall -Wextra -o /tmp/q0w /tmp/q0w.c
          /tmp/q0w

  windows-runtime-witness:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Execute raw bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=@'
          using System;
          using System.Runtime.InteropServices;
          public static class Q0W {
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern IntPtr VirtualAlloc(IntPtr a, UIntPtr s, uint t, uint p);
              [UnmanagedFunctionPointer(CallingConvention.Winapi)]
              delegate ulong F();
              public static ulong Run(byte[] b) {
                  IntPtr m=VirtualAlloc(IntPtr.Zero,(UIntPtr)b.Length,0x3000,0x40);
                  if(m==IntPtr.Zero) throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());
                  Marshal.Copy(b,0,m,b.Length);
                  return Marshal.GetDelegateForFunctionPointer<F>(m)();
              }
          }
          '@
          Add-Type -TypeDefinition $src
          [byte[]]$b=[IO.File]::ReadAllBytes('q0.qev0')
          if($b.Length -ne 21){throw "length=$($b.Length)"}
          [UInt64]$v=[Q0W]::Run($b)
          [UInt64]$e=[Convert]::ToUInt64('22A720A6791C70FB',16)
          if($v -ne $e){throw ('got={0:X16} expected={1:X16}' -f $v,$e)}
          'Q0_WINDOWS=PASS'
