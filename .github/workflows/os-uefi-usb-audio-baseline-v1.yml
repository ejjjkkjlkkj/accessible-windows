name: os-uefi-usb-audio-baseline-v1

on:
  push:
    branches: [uefi-usb-audio-baseline-20260921]
    paths:
      - 'boot/uefi-usb-audio-baseline-v1/**'
      - '.github/workflows/os-uefi-usb-audio-baseline-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ovmf-usb-audio-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install UEFI USB Audio test toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-x86 ovmf

      - name: Build freestanding EFI probe
        run: |
          set -euo pipefail
          root=boot/uefi-usb-audio-baseline-v1
          flags='--target=x86_64-pc-windows-msvc -ffreestanding -fshort-wchar -fno-stack-protector -fno-builtin -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $flags -c "$root/usb_audio_baseline_uefi.c" -o "$root/usb_audio_baseline_uefi.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/USB-AUDIO-BASELINE.EFI" "$root/usb_audio_baseline_uefi.obj"
          test -s "$root/USB-AUDIO-BASELINE.EFI"
          file "$root/USB-AUDIO-BASELINE.EFI"
          grep -aF 'QEVARYNOX-UEFI-USB-AUDIO-BASELINE-V1' "$root/USB-AUDIO-BASELINE.EFI"
          grep -aF 'USB_AUDIO_CUSTOM_XHCI_REQUIRED=PASS' "$root/USB-AUDIO-BASELINE.EFI"
          sha256sum "$root/USB-AUDIO-BASELINE.EFI" | tee "$root/efi.sha256"
          echo USB_AUDIO_BASELINE_BUILD=PASS

      - name: Resolve OVMF
        run: |
          set -euo pipefail
          code=''
          vars=''
          for pair in             '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd'             '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd'             '/usr/share/qemu/OVMF_CODE.fd|/usr/share/qemu/OVMF_VARS.fd'
          do
            c="${pair%%|*}"
            v="${pair#*|}"
            if [ -f "$c" ] && [ -f "$v" ]; then
              code="$c"
              vars="$v"
              break
            fi
          done
          if [ -z "$code" ]; then
            echo 'Installed OVMF files:'
            find /usr/share/OVMF /usr/share/qemu -maxdepth 2 -type f -name '*OVMF*.fd' -print 2>/dev/null || true
            exit 1
          fi
          code_size=$(stat -c %s "$code")
          vars_size=$(stat -c %s "$vars")
          if [ "$code_size" -ne "$vars_size" ]; then
            echo "OVMF size mismatch: code=$code_size vars=$vars_size"
            exit 1
          fi
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
          echo "OVMF_CODE_PATH=$code"
          echo "OVMF_VARS_PATH=$vars"
          echo "OVMF_PAIR_BYTES=$code_size"
          echo USB_AUDIO_BASELINE_OVMF=PASS

      - name: Boot QEMU xHCI with USB Audio
        run: |
          set -euo pipefail
          root=boot/uefi-usb-audio-baseline-v1
          runtime="$root/runtime"
          rm -rf "$runtime"
          mkdir -p "$runtime/esp/EFI/BOOT"
          cp "$root/USB-AUDIO-BASELINE.EFI" "$runtime/esp/EFI/BOOT/BOOTX64.EFI"
          cp "$OVMF_VARS" "$runtime/OVMF_VARS.fd"

          set +e
          timeout 35s qemu-system-x86_64             -machine q35,accel=tcg             -m 256M             -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE"             -drive if=pflash,format=raw,file="$runtime/OVMF_VARS.fd"             -drive format=raw,file=fat:rw:"$runtime/esp"             -device qemu-xhci,id=xhci             -audiodev wav,id=aud,path="$runtime/usb-audio.wav"             -device usb-audio,bus=xhci.0,audiodev=aud             -display none -monitor none             -serial file:"$runtime/serial.log"             -parallel none -net none             -no-reboot -no-shutdown
          qrc=$?
          set -e
          if [ "$qrc" -ne 0 ] && [ "$qrc" -ne 124 ]; then
            echo "QEMU_EXIT=$qrc"
            exit "$qrc"
          fi

          test -s "$runtime/serial.log"
          cat "$runtime/serial.log"
          grep -F 'QEVARYNOX-UEFI-USB-AUDIO-BASELINE-V1' "$runtime/serial.log"
          grep -F 'USB_IO_HANDLE_LIST=PASS' "$runtime/serial.log"
          grep -F 'QEMU_USB_AUDIO_46F4_0002=PASS' "$runtime/serial.log"
          grep -F 'USB_AUDIO_ALT1=PASS' "$runtime/serial.log"
          grep -F 'QEMU_USB_AUDIO_TARGET=CONFIRMED' "$runtime/serial.log"

          if grep -Fq 'USB_AUDIO_ISOCHRONOUS=EFI_UNSUPPORTED' "$runtime/serial.log"; then
            grep -F 'USB_AUDIO_CUSTOM_XHCI_REQUIRED=PASS' "$runtime/serial.log"
            grep -F 'STATUS=EXPECTED_BASELINE_BLOCK' "$runtime/serial.log"
            result=EFI_UNSUPPORTED
          elif grep -Fq 'USB_AUDIO_ISOCHRONOUS=PASS' "$runtime/serial.log"; then
            grep -F 'USB_AUDIO_FIRMWARE_PATH=AVAILABLE' "$runtime/serial.log"
            grep -F 'STATUS=PASS' "$runtime/serial.log"
            result=EFI_SUCCESS
          else
            echo 'Neither expected EFI_UNSUPPORTED nor EFI_SUCCESS was observed.'
            exit 1
          fi

          {
            echo 'OS-UEFI-USB-AUDIO-BASELINE-V1'
            echo "head-sha=$GITHUB_SHA"
            echo 'qemu-machine=q35'
            echo 'usb-controller=qemu-xhci'
            echo 'usb-audio=46f4:0002'
            echo 'stream=48000-s16le-stereo'
            echo 'packet-bytes=192'
            echo "isochronous-result=$result"
            echo 'result=PASS'
          } > "$runtime/result.txt"
          sha256sum "$runtime/serial.log" "$runtime/result.txt" "$root/USB-AUDIO-BASELINE.EFI" > "$runtime/hashes.txt"
          echo USB_AUDIO_BASELINE_RUNTIME=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-usb-audio-baseline-v1
          path: |
            boot/uefi-usb-audio-baseline-v1/USB-AUDIO-BASELINE.EFI
            boot/uefi-usb-audio-baseline-v1/efi.sha256
            boot/uefi-usb-audio-baseline-v1/runtime/serial.log
            boot/uefi-usb-audio-baseline-v1/runtime/usb-audio.wav
            boot/uefi-usb-audio-baseline-v1/runtime/result.txt
            boot/uefi-usb-audio-baseline-v1/runtime/hashes.txt
          if-no-files-found: error
