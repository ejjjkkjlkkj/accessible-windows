        run: cargo +1.98.1 test -p aw-core capability_ -- --nocapture

  cognitive-intent-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Native cognitive intent authorization
        run: cargo +1.98.1 test -p aw-core cognitive_ -- --nocapture

  bare-metal-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain and targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.98.1 x86_64-unknown-none x86_64-unknown-uefi
      - name: Native semantic core bare-metal check
        run: cargo +1.98.1 check -p aw-core --target x86_64-unknown-none
      - name: Bare-metal kernel check
        run: cargo +1.98.1 check -p aw-kernel --target x86_64-unknown-none
      - name: Native storage bare-metal check
        run: cargo +1.98.1 check -p aw-storage --target x86_64-unknown-none
      - name: UEFI check
        run: cargo +1.98.1 check -p aw-uefi --target x86_64-unknown-uefi
 sovereign/ORIGIN.manifest
          grep -q 'evidence-required=A+B' sovereign/ORIGIN.manifest
          grep -q 'AWL0' sovereign/awl0/SPEC.md
          grep -q 'AWOBJ000' sovereign/awobj0/SPEC.md
          grep -q 'Status:.*UNPROVEN\|UNPROVEN' sovereign/seed0/SEED_SPEC.md
          if grep -R -nEi --include='*.awl' --include='*.awseed' --include='*.awobj'              '(^|[^A-Za-z])(rust|python|cargo|llvm|clang|gcc|msvc|dotnet|node|npm)([^A-Za-z]|$)' sovereign; then
            echo "Foreign toolchain ancestry marker detected in canonical sovereign source."
            exit 1
          fi
      - name: Evidence A - canonical language specimen
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^cell FoundationProbe {' sovereign/awl0/foundation.awl
          grep -q 'deny kernel.authority' sovereign/awl0/foundation.awl
          grep -q 'path keyboard | speech | braille' sovereign/awl0/foundation.awl
          grep -q 'keep result' sovereign/awl0/foundation.awl
          grep -q 'shed scratch' sovereign/awl0/foundation.awl

  sovereign-byte-evidence:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Evidence B - canonical byte identity (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sha256sum             docs/ORIGIN.md             sovereign/ORIGIN.manifest             sovereign/awl0/SPEC.md             sovereign/awl0/foundation.awl             sovereign/awobj0/SPEC.md             sovereign/seed0/SEED_SPEC.md
      - name: Evidence B - canonical byte identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @(
            'docs/ORIGIN.md',
            'sovereign/ORIGIN.manifest',
            'sovereign/awl0/SPEC.md',
            'sovereign/awl0/foundation.awl',
            'sovereign/awobj0/SPEC.md',
            'sovereign/seed0/SEED_SPEC.md'
          ) | ForEach-Object {
            $h = Get-FileHash -Algorithm SHA256 $_
            "$($h.Hash.ToLower())  $($_)"
          }

  host-validation:
    strategy:
      fail-fast: false
