name: Qevarynox sovereign proof witness

on:
  push:
    branches: [os]
  pull_request:
    branches: [os]

permissions:
  contents: read

jobs:
  sovereign-format-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reject non-Qevarynox sovereign extensions
        shell: bash
        run: |
          set -euo pipefail
          test -s sovereign/formats0/registry.qevformats0
          bad="$(find sovereign -type f | grep -Ev '\.(qevsource0|qevobject0|qevspec0|qevmanifest0|qevhash0|qevaccess0|qevformats0|qevtools0|qevproof0|qevseed0|qevimage0|qevpackage0|qevcatalog0|qevconfig0|qevtrace0|qevtest0|qevcorpus0|qevbench0|qevsymbol0|qevabi0|qevschema0|qevmessage0|qevcap0|qevgenome0|qevmorph0|qevmemory0|qevsemantic0|qevsnapshot0|qevupdate0|qevdevice0|qevdriver0|qevaudit0|qevcrash0|qevrecovery0|qevdoc0|qevreport0|qevlocale0|qevfont0|qevspeech0|qevbraille0|qevkey0|qevsig0)$' || true)"
          if [ -n "$bad" ]; then
            echo "Non-Qevarynox sovereign extension detected:"
            echo "$bad"
            exit 1
          fi
          grep -q '^QEVARYNOX_FORMATS_0' sovereign/formats0/registry.qevformats0
          grep -q 'extension = .qevsource0' sovereign/formats0/registry.qevformats0
          grep -q 'extension = .qevobject0' sovereign/formats0/registry.qevformats0

  namespace-cleanliness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Retired collided identifiers cannot return
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'AW0|AWL0|A11Y0|awlink0' sovereign; then
            echo 'Retired/collided identifier found in active sovereign tree.'
            exit 1
          fi
          grep -q '^identity = QEVARYNOX$' sovereign/namespace0/identity.qevspec0

  zero-base-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reject foreign software foundation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Cargo.toml
          test ! -e rust-toolchain.toml
          test ! -d crates
          test ! -d boot
          grep -q '^policy = ZERO-SOFTWARE-ANCESTRY$' sovereign/origin0/origin.qevmanifest0
          grep -q '^accessibility-omission = FORBIDDEN$' sovereign/origin0/origin.qevmanifest0
          if find sovereign -type f \( -name '*.rs' -o -name '*.py' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.md' -o -name '*.toml' \) | grep -q .; then
            echo 'Foreign source/document extension detected in sovereign tree.'
            exit 1
          fi

  accessibility-completeness-A:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Every sovereign artifact has accessibility record
        shell: bash
        run: |
          set -euo pipefail
          find sovereign -type f | sort > /tmp/active
          awk -F'|' 'index($0,"|")>0 && $0 !~ /^#/ {print $1}' sovereign/access0/registry.qevaccess0 | sort > /tmp/registered
          diff -u /tmp/active /tmp/registered
          test "$(sort /tmp/registered | uniq -d | wc -l)" -eq 0
          grep -q '^QEVARYNOX_SRC_0' sovereign/lang0/foundation.qevsource0
          grep -q 'proof accessibility' sovereign/lang0/foundation.qevsource0
          grep -q 'path keyboard | speech | braille' sovereign/lang0/foundation.qevsource0

  code-origin-D:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Every sovereign artifact has D origin record
        shell: bash
        run: |
          set -euo pipefail
          find sovereign -type f | sort > /tmp/active
          awk -F'|' 'index($0,"|")>0 && $0 !~ /^#/ {print $1}' sovereign/origin0/code-origin.qevmanifest0 | sort > /tmp/origin
          diff -u /tmp/active /tmp/origin
          test "$(sort /tmp/origin | uniq -d | wc -l)" -eq 0
          if grep -v '^QEVARYNOX_' sovereign/origin0/code-origin.qevmanifest0 | grep 'external-source=' | grep -v 'external-source=none'; then
            echo 'Imported source detected in sovereign origin ledger.'
            exit 1
          fi

  prior-art-C-truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: C cannot pass without claim review
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^identity = QEVARYNOX.PROOF.C$' sovereign/prior0/policy.qevspec0
          grep -q '^missing-claim-chart = UNPROVEN$' sovereign/prior0/policy.qevspec0
          if grep -R -n '^C = PASS$' sovereign; then
            echo 'Unexpected C=PASS before claim-chart artifacts exist.'
            exit 1
          fi

  tool-registry-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Implemented native tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in qevseed0 qevencode0 qevlink0 qevcompile0 qevprove0 qevaccess0 qevbuild0 qevtrace0 qevfuzz0 qevpack0; do
            grep -q "name = $tool" sovereign/tools0/registry.qevtools0
            test -s "sovereign/tools0/src/$tool.qevsource0"
            grep -q '^QEVARYNOX_SRC_0' "sovereign/tools0/src/$tool.qevsource0"
            grep -q 'proof accessibility' "sovereign/tools0/src/$tool.qevsource0"
            grep -q 'deny capability.mint' "sovereign/tools0/src/$tool.qevsource0"
            grep -q 'deny accessibility.disable' "sovereign/tools0/src/$tool.qevsource0"
          done
      - name: Required future tools stay explicit
        shell: bash
        run: |
          set -euo pipefail
          for tool in qevdecode0 qevtest0 qevbench0 qevdebug0 qevprofile0 qevinspect0 qevformat0 qevlint0 qevdoc0 qevedit0 qevshell0 qevinstall0 qevupdate0 qevrecover0 qevimage0 qevrepro0 qevsign0 qevverify0 qevrepo0 qevci0 qevschema0 qevgenome0 qevdevice0 qevnet0 qevlocale0 qevspeech0 qevbraille0 qevmodel0 qevtrain0 qevmedia0; do
            grep -q "name = $tool" sovereign/tools0/registry.qevtools0
          done

  external-byte-witness:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: External byte witness on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find sovereign -type f -print0 | sort -z | xargs -0 sha256sum
      - name: External byte witness on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem sovereign -Recurse -File | Sort-Object FullName | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$h  $($_.FullName)"
          }

  claim-discipline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Preserve explicit UNPROVEN states
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'status = UNPROVEN' sovereign/seed0/seed.qevspec0
          grep -q '|interactive|PASS|UNPROVEN|' sovereign/access0/registry.qevaccess0
          grep -q 'C = UNPROVEN' sovereign/tools0/registry.qevtools0

  completeness-catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Required architecture domains are never silently omitted
        shell: bash
        run: |
          set -euo pipefail
          test -s sovereign/catalog0/system.qevcatalog0
          for domain in bootstrap-machine-boundary toolchain development-environment proof-validation kernel-core security regeneration storage device-model networking semantic-accessibility cognition-memory native-productivity text-locale identity-session system-services package-update compatibility-boundaries release-distribution; do
            grep -q "name = $domain" sovereign/catalog0/system.qevcatalog0
          done
          grep -q 'release-rule = no-required-component-may-be-MISSING' sovereign/catalog0/system.qevcatalog0

  accessibility-proof-truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Byte checks are not accessibility B
        shell: bash
        run: |
          set -euo pipefail
          if grep -E '\|PASS\|PASS\|QEVARYNOX\.ACCESS\.' sovereign/access0/registry.qevaccess0; then
            echo 'Unexpected accessibility B=PASS without native behavioral proof artifacts.'
            exit 1
          fi
          grep -q 'B-PASS-requires-independent-behavioral-witness' sovereign/access0/format.qevspec0


  seed0-structural-A:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify exact manually-authored Seed-0 pulse bytes
        shell: bash
        run: |
          set -euo pipefail
          f=sovereign/seed0/pulse-x86_64.qevseed0
          test "$(wc -c < "$f")" -eq 11
          test "$(sha256sum "$f" | awk '{print $1}')" = "bc36f9cbf9dc43f58a2b0cbfdea7011df8e912f476670524fcf520eeec971bee"
          hex="$(od -An -tx1 -v "$f" | tr -d ' \n')"
          test "$hex" = "48b85145564152594e58c3"
          printf '\x48\xb8\x51\x45\x56\x41\x52\x59\x4e\x58\xc3' > /tmp/qev-seed-reconstructed.bin
          cmp -s "$f" /tmp/qev-seed-reconstructed.bin
          grep -q '^A = PASS$' sovereign/seed0/pulse-x86_64.qevproof0
          grep -q '^B = PASS
          grep -q '^D = PASS$' sovereign/seed0/byte-origin.qevmanifest0

  seed0-runtime-B-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Execute Seed-0 pulse with independent Linux witness
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/qev_seed_witness.c <<'EOF'
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>
          typedef uint64_t (*seed_fn)(void);
          int main(int argc, char **argv) {
              if (argc != 2) return 10;
              FILE *fp = fopen(argv[1], "rb");
              if (!fp) return 11;
              unsigned char src[11];
              if (fread(src, 1, sizeof(src), fp) != sizeof(src)) return 12;
              if (fgetc(fp) != EOF) return 13;
              fclose(fp);
              void *mem = mmap(NULL, sizeof(src), PROT_READ|PROT_WRITE|PROT_EXEC,
                               MAP_PRIVATE|MAP_ANONYMOUS, -1, 0);
              if (mem == MAP_FAILED) return 14;
              memcpy(mem, src, sizeof(src));
              seed_fn run = (seed_fn)mem;
              const uint64_t expected = UINT64_C(0x584E595241564551);
              uint64_t value = run();
              if (value != expected) return 15;
              ((unsigned char*)mem)[2] ^= 1u;
              uint64_t corrupt = run();
              if (corrupt == expected) return 16;
              printf("QEVARYNOX_SEED0_RUNTIME_B_LINUX=PASS value=%016llx corrupt=%016llx\n",
                     (unsigned long long)value, (unsigned long long)corrupt);
              munmap(mem, sizeof(src));
              return 0;
          }
          EOF
          cc -O2 -Wall -Wextra -o /tmp/qev_seed_witness /tmp/qev_seed_witness.c
          /tmp/qev_seed_witness sovereign/seed0/pulse-x86_64.qevseed0

  seed0-runtime-B-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Execute Seed-0 pulse with independent Windows witness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = @'
          using System;
          using System.Runtime.InteropServices;
          public static class QevSeedWitness {
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern IntPtr VirtualAlloc(IntPtr address, UIntPtr size, uint allocationType, uint protect);
              [UnmanagedFunctionPointer(CallingConvention.Winapi)]
              public delegate ulong Seed();
              public static ulong Run(byte[] bytes) {
                  IntPtr p = VirtualAlloc(IntPtr.Zero, (UIntPtr)bytes.Length, 0x3000, 0x40);
                  if (p == IntPtr.Zero) throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());
                  Marshal.Copy(bytes, 0, p, bytes.Length);
                  Seed f = Marshal.GetDelegateForFunctionPointer<Seed>(p);
                  return f();
              }
          }
          '@
          Add-Type -TypeDefinition $src
          $path = 'sovereign/seed0/pulse-x86_64.qevseed0'
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -ne 11) { throw "Unexpected seed length: $($bytes.Length)" }
          [UInt64]$expected = [Convert]::ToUInt64('584E595241564551', 16)
          [UInt64]$value = [QevSeedWitness]::Run($bytes)
          if ($value -ne $expected) { throw ('Seed returned {0:X16}, expected {1:X16}' -f $value,$expected) }
          $bytes[2] = $bytes[2] -bxor 1
          [UInt64]$corrupt = [QevSeedWitness]::Run($bytes)
          if ($corrupt -eq $expected) { throw 'Corruption negative witness failed' }
          'QEVARYNOX_SEED0_RUNTIME_B_WINDOWS=PASS value={0:X16} corrupt={1:X16}' -f $value,$corrupt
 sovereign/seed0/pulse-x86_64.qevproof0
          grep -q '^D = PASS$' sovereign/seed0/byte-origin.qevmanifest0

  seed0-runtime-B-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
