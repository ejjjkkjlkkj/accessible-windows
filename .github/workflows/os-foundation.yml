                     (unsigned long long)value, (unsigned long long)corrupt);
              munmap(mem, sizeof(src));
              return 0;
          }
          EOF
          cc -O2 -Wall -Wextra -o /tmp/qev_seed_witness /tmp/qev_seed_witness.c
          /tmp/qev_seed_witness sovereign/seed0/pulse-x86_64.qevseed0

