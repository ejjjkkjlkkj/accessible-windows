name: OS foundation

on:
  push:
    branches: [os]
  pull_request:
    branches: [os]

permissions:
  contents: read

# Cargo intentionally uses runner-sized automatic parallelism.
# No fixed -j cap is set: every runner uses all logical CPUs it exposes.

jobs:
  architecture-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reject a separate accessibility subsystem
        shell: bash
        run: |
          test ! -e crates/aw-accessibility
          if grep -R -nEi --include='*.rs' --include='Cargo.toml'             'UIAutomation|MSAA|IAccessible|AT-SPI|AXAPI|Android Accessibility|AccessKit|Electron|GTK|Qt'             crates boot; then
            echo "External accessibility/UI framework dependency detected."
            exit 1
          fi
      - name: Keep native storage from-zero
        shell: bash
        run: |
          if grep -nEi 'ntfs|refs|ext4|xfs|btrfs|zfs|apfs|f2fs' crates/aw-storage/Cargo.toml; then
            echo "Foreign filesystem dependency detected in native storage."
            exit 1
          fi
      - name: Require architectural constitution
        shell: bash
        run: |
          test -s docs/CONSTITUTION.md
          test -s docs/STORAGE.md
          test -s docs/SOVEREIGN_TOOLCHAIN.md
          grep -q "Accessibility is intrinsic" docs/CONSTITUTION.md
          grep -q "GitHub Actions is authoritative evidence" docs/CONSTITUTION.md
          grep -q "Evidence A" docs/CONSTITUTION.md
          grep -q "Evidence B" docs/CONSTITUTION.md
          grep -q "Sovereign language and toolchain" docs/CONSTITUTION.md
          grep -q "Accessibility contract for every tool" docs/SOVEREIGN_TOOLCHAIN.md
          grep -q '"Better" requires comparison evidence' docs/SOVEREIGN_TOOLCHAIN.md
          grep -q "NOT IMPLEMENTED" docs/STORAGE.md
          grep -q "pub struct SemanticObjectV1" crates/aw-core/src/lib.rs
          grep -q "pub struct MemoryRecordV1" crates/aw-core/src/lib.rs
          grep -q "pub struct CapabilityGrantV1" crates/aw-core/src/lib.rs
          grep -q "KernelAuthority" docs/SECURITY.md
          grep -q "SystemSovereign" docs/SECURITY.md
          grep -q "pub struct CognitiveIntentV1" crates/aw-core/src/lib.rs
          grep -q "NOT IMPLEMENTED" docs/COGNITION.md

  sovereign-origin-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Evidence A - clean-room sovereign structure
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/ORIGIN.md
          test -s sovereign/ORIGIN.manifest
          test -s sovereign/awl0/SPEC.md
          test -s sovereign/awl0/foundation.awl
          test -s sovereign/awobj0/SPEC.md
          test -s sovereign/seed0/SEED_SPEC.md
          grep -q '^AW-SOVEREIGN-ORIGIN 1    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Host tests
        run: cargo +1.98.1 test --workspace --exclude aw-uefi
      - name: Clippy
        run: cargo +1.98.1 clippy --workspace --exclude aw-uefi --all-targets -- -D warnings

  storage-recovery-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Publication model
        run: cargo +1.98.1 test -p aw-storage publication -- --nocapture
      - name: Recovery model
        run: cargo +1.98.1 test -p aw-storage recovery -- --nocapture
      - name: Crash-cut durability model
        run: cargo +1.98.1 test -p aw-storage crash_cut -- --nocapture

  storage-object-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Native object model
        run: cargo +1.98.1 test -p aw-storage object_descriptor -- --nocapture

  storage-relation-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
