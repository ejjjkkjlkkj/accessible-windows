name: Sovereign proof witness

on:
  push:
    branches: [os]
  pull_request:
    branches: [os]

permissions:
  contents: read

jobs:
  sovereign-format-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reject non-AW0 sovereign extensions
        shell: bash
        run: |
          set -euo pipefail
          test -s sovereign/formats0/registry.awformats0
          bad="$(find sovereign -type f | grep -Ev '\.(awsource0|awobject0|awspec0|awmanifest0|awhash0|awa11y0|awformats0|awtools0|awproof0|awseed0|awimage0|awpackage0)$' || true)"
          if [ -n "$bad" ]; then
            echo "Non-AW0 sovereign extension detected:"
            echo "$bad"
            exit 1
          fi
          grep -q '^AW0FMT00' sovereign/formats0/registry.awformats0
          grep -q 'extension = .awsource0' sovereign/formats0/registry.awformats0
          grep -q 'extension = .awobject0' sovereign/formats0/registry.awformats0
          grep -q 'extension = .awspec0' sovereign/formats0/registry.awformats0

  zero-base-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reject foreign software foundation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Cargo.toml
          test ! -e rust-toolchain.toml
          test ! -d crates
          test ! -d boot
          grep -q '^policy = ZERO-SOFTWARE-ANCESTRY$' sovereign/origin0/origin.awmanifest0
          grep -q '^accessibility-omission = FORBIDDEN$' sovereign/origin0/origin.awmanifest0
          if find sovereign -type f \( -name '*.rs' -o -name '*.py' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.md' -o -name '*.toml' \) | grep -q .; then
            echo 'Foreign source/document extension detected in sovereign tree.'
            exit 1
          fi

  accessibility-completeness-A:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Every sovereign artifact has A11Y0 record
        shell: bash
        run: |
          set -euo pipefail
          find sovereign -type f | sort > /tmp/active
          tail -n +3 sovereign/a11y0/registry.awa11y0 | cut -d'|' -f1 | sort > /tmp/registered
          diff -u /tmp/active /tmp/registered
          test "$(sort /tmp/registered | uniq -d | wc -l)" -eq 0
          grep -q '^AW0SRC00' sovereign/lang0/foundation.awsource0
          grep -q 'proof accessibility' sovereign/lang0/foundation.awsource0
          grep -q 'path keyboard | speech | braille' sovereign/lang0/foundation.awsource0
          grep -q 'accessibility = mandatory-A+B' sovereign/tools0/registry.awtools0

  accessibility-completeness-B:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Independent AW0 witness on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find sovereign -type f -print0 | sort -z | xargs -0 sha256sum
          grep -q 'foundation.awsource0|interactive|PASS|UNPROVEN|' sovereign/a11y0/registry.awa11y0
      - name: Independent AW0 witness on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem sovereign -Recurse -File | Sort-Object FullName | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$h  $($_.FullName)"
          }
          if (-not (Select-String -Quiet -Path sovereign/a11y0/registry.awa11y0 -Pattern 'foundation.awsource0\|interactive\|PASS\|UNPROVEN\|')) {
            throw 'Missing interactive A+B state'
          }

  tool-registry-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Project-owned tool names and accessibility obligations
        shell: bash
        run: |
          set -euo pipefail
          for tool in awseed0 awencode0 awlink0 awcompile0 awprove0 awa11y0 awbuild0 awtrace0 awfuzz0 awpack0; do
            grep -q "name = $tool" sovereign/tools0/registry.awtools0
          done
          test "$(grep -c 'accessibility = .*A+B' sovereign/tools0/registry.awtools0)" -ge 10

  claim-discipline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Preserve explicit UNPROVEN states
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'status = UNPROVEN' sovereign/seed0/seed.awspec0
          grep -q 'foundation.awsource0|interactive|PASS|UNPROVEN|' sovereign/a11y0/registry.awa11y0
