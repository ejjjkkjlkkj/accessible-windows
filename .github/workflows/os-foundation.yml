name: Sovereign proof witness

on:
  push:
    branches: [os]
  pull_request:
    branches: [os]

permissions:
  contents: read

# External bootstrap witness only.
# Hosted shells and operating systems are not part of the sovereign toolchain.

jobs:
  zero-base-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reject foreign software foundation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Cargo.toml
          test ! -e rust-toolchain.toml
          test ! -d crates
          test ! -d boot
          grep -q '^policy=zero-software-ancestry$' sovereign/ORIGIN.manifest
          grep -q '^accessibility-omission=forbidden$' sovereign/ORIGIN.manifest
          if find sovereign -type f \( -name '*.rs' -o -name '*.py' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) | grep -q .; then
            echo 'Foreign-language implementation file detected in sovereign tree.'
            exit 1
          fi

  accessibility-completeness-A:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Every sovereign artifact has A11Y0 record
        shell: bash
        run: |
          set -euo pipefail
          find sovereign -type f ! -path 'sovereign/a11y0/REGISTRY.a11y' | sort > /tmp/active
          awk -F'|' '!/^#/ && NF==5 {print $1}' sovereign/a11y0/REGISTRY.a11y | sort > /tmp/registered
          diff -u /tmp/active /tmp/registered
          test "$(sort /tmp/registered | uniq -d | wc -l)" -eq 0
          grep -q 'proof accessibility' sovereign/awl0/foundation.awl
          grep -q 'path keyboard | speech | braille' sovereign/awl0/foundation.awl
          grep -q 'A11Y0.FOUNDATION.NO-HUMAN-PATH-WITHOUT-SEMANTICS' sovereign/awl0/foundation.awl

  accessibility-completeness-B:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Independent A11Y0 witness on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          awk -F'|' '!/^#/ && NF==5 {print $1 "|" $3 "|" $4}' sovereign/a11y0/REGISTRY.a11y
          sha256sum sovereign/awl0/foundation.awl sovereign/a11y0/REGISTRY.a11y
      - name: Independent A11Y0 witness on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content sovereign/a11y0/REGISTRY.a11y | Where-Object { -not $_.StartsWith('#') }
          Get-FileHash -Algorithm SHA256 sovereign/awl0/foundation.awl
          Get-FileHash -Algorithm SHA256 sovereign/a11y0/REGISTRY.a11y

  claim-discipline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Preserve explicit UNPROVEN states
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'UNPROVEN' sovereign/seed0/SEED_SPEC.md
          grep -q 'foundation.awl|interactive|PASS|UNPROVEN|' sovereign/a11y0/REGISTRY.a11y
