name: OS foundation

on:
  push:
    branches: [os]
  pull_request:
    branches: [os]

permissions:
  contents: read

jobs:
  architecture-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reject a separate accessibility subsystem
        shell: bash
        run: |
          test ! -e crates/aw-accessibility
          if grep -R -nEi --include='*.rs' --include='Cargo.toml'             'UIAutomation|MSAA|IAccessible|AT-SPI|AXAPI|Android Accessibility|AccessKit|Electron|GTK|Qt'             crates boot; then
            echo "External accessibility/UI framework dependency detected."
            exit 1
          fi
      - name: Keep native storage from-zero
        shell: bash
        run: |
          if grep -nEi 'ntfs|refs|ext4|xfs|btrfs|zfs|apfs|f2fs' crates/aw-storage/Cargo.toml; then
            echo "Foreign filesystem dependency detected in native storage."
            exit 1
          fi
      - name: Require architectural constitution
        shell: bash
        run: |
          test -s docs/CONSTITUTION.md
          test -s docs/STORAGE.md
          grep -q "Accessibility is intrinsic" docs/CONSTITUTION.md
          grep -q "GitHub Actions is authoritative" docs/CONSTITUTION.md
          grep -q "NOT IMPLEMENTED" docs/STORAGE.md
          grep -q "pub struct SemanticObjectV1" crates/aw-core/src/lib.rs

  host-validation:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Host tests
        run: cargo +1.98.1 test --workspace --exclude aw-uefi
      - name: Clippy
        run: cargo +1.98.1 clippy --workspace --exclude aw-uefi --all-targets -- -D warnings

  storage-recovery-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Publication model
        run: cargo +1.98.1 test -p aw-storage publication -- --nocapture
      - name: Recovery model
        run: cargo +1.98.1 test -p aw-storage recovery -- --nocapture
      - name: Crash-cut durability model
        run: cargo +1.98.1 test -p aw-storage crash_cut -- --nocapture

  storage-object-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Native object model
        run: cargo +1.98.1 test -p aw-storage object_descriptor -- --nocapture

  storage-relation-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Native relation graph
        run: cargo +1.98.1 test -p aw-storage relation_record -- --nocapture

  storage-namespace-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Native namespace projection
        run: cargo +1.98.1 test -p aw-storage namespace_binding -- --nocapture

  semantic-core-model:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Native semantic source of truth
        run: cargo +1.98.1 test -p aw-core semantic_ -- --nocapture

  bare-metal-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain and targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.98.1 x86_64-unknown-none x86_64-unknown-uefi
      - name: Native semantic core bare-metal check
        run: cargo +1.98.1 check -p aw-core --target x86_64-unknown-none
      - name: Bare-metal kernel check
        run: cargo +1.98.1 check -p aw-kernel --target x86_64-unknown-none
      - name: Native storage bare-metal check
        run: cargo +1.98.1 check -p aw-storage --target x86_64-unknown-none
      - name: UEFI check
        run: cargo +1.98.1 check -p aw-uefi --target x86_64-unknown-uefi
