name: X64 extended validation

on:
  push:
    branches: [main, bootstrap-v0.1]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/extended-platforms.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/extended-platforms.yml"
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: x64-extended-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-validation:
    name: X64 release crates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert x64 runner
        shell: bash
        run: |
          case "${RUNNER_ARCH}" in
            X64|x64|X86_64|x86_64) ;;
            *) echo "Accessible Windows is x64-only; refusing runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: x64-release-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Release check
        run: cargo check --workspace --all-targets --release

      - name: Release tests
        run: cargo test --workspace --all-targets --release

      - name: Release clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings
