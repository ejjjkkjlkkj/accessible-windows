name: os-uefi-xhci-direct-stage1-v1

on:
  push:
    branches: [uefi-usb-audio-baseline-20260921]
    paths:
      - 'boot/uefi-xhci-direct-stage1-v1/**'
      - '.github/workflows/os-uefi-xhci-direct-stage1-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-xhci-mmio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-x86 ovmf

      - name: Build direct xHCI EFI probe
        run: |
          set -euo pipefail
          root=boot/uefi-xhci-direct-stage1-v1
          flags='--target=x86_64-pc-windows-msvc -ffreestanding -fshort-wchar -fno-stack-protector -fno-builtin -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $flags -c "$root/xhci_stage1_uefi.c" -o "$root/xhci_stage1_uefi.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/XHCI-STAGE1.EFI" "$root/xhci_stage1_uefi.obj"
          test -s "$root/XHCI-STAGE1.EFI"
          file "$root/XHCI-STAGE1.EFI"
          grep -aF 'QEVARYNOX-UEFI-XHCI-DIRECT-STAGE1-V1' "$root/XHCI-STAGE1.EFI"
          grep -aF 'XHCI_DIRECT_MMIO_OWNERSHIP_BASELINE=PASS' "$root/XHCI-STAGE1.EFI"
          sha256sum "$root/XHCI-STAGE1.EFI" | tee "$root/efi.sha256"
          echo XHCI_STAGE1_BUILD=PASS

      - name: Resolve OVMF
        run: |
          set -euo pipefail
          code=/usr/share/OVMF/OVMF_CODE_4M.fd
          vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          if [ ! -f "$code" ] || [ ! -f "$vars" ]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars=/usr/share/OVMF/OVMF_VARS.fd
          fi
          test -f "$code"
          test -f "$vars"
          echo "OVMF_CODE=$code" >> "$GITHUB_ENV"
          echo "OVMF_VARS=$vars" >> "$GITHUB_ENV"
          echo XHCI_STAGE1_OVMF=PASS

      - name: Boot direct xHCI probe with USB Audio attached
        run: |
          set -euo pipefail
          root=boot/uefi-xhci-direct-stage1-v1
          rt="$root/runtime"
          rm -rf "$rt"
          mkdir -p "$rt/esp/EFI/BOOT"
          cp "$root/XHCI-STAGE1.EFI" "$rt/esp/EFI/BOOT/BOOTX64.EFI"
          cp "$OVMF_VARS" "$rt/OVMF_VARS.fd"

          set +e
          timeout 25s qemu-system-x86_64             -machine q35,accel=tcg             -m 256M             -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE"             -drive if=pflash,format=raw,file="$rt/OVMF_VARS.fd"             -drive format=raw,file=fat:rw:"$rt/esp"             -device qemu-xhci,id=xhci             -audiodev wav,id=aud,path="$rt/usb-audio.wav"             -device usb-audio,bus=xhci.0,audiodev=aud             -display none -monitor none             -serial file:"$rt/serial.log"             -parallel none -net none -no-reboot -no-shutdown
          qrc=$?
          set -e
          if [ "$qrc" -ne 0 ] && [ "$qrc" -ne 124 ]; then exit "$qrc"; fi

          test -s "$rt/serial.log"
          cat "$rt/serial.log"
          for marker in             'QEVARYNOX-UEFI-XHCI-DIRECT-STAGE1-V1'             'XHCI_PCI_CLASS_0C0330=PASS'             'XHCI_MMIO_MAP=PASS'             'XHCI_CAPABILITY_REGISTERS=PASS'             'XHCI_CONTROLLER_READY=PASS'             'XHCI_PORT_SCAN=PASS'             'XHCI_DIRECT_MMIO_OWNERSHIP_BASELINE=PASS'             'XHCI_DESTRUCTIVE_RESET=NOT_ATTEMPTED'             'STATUS=PASS'
          do
            grep -F "$marker" "$rt/serial.log"
          done

          {
            echo 'OS-UEFI-XHCI-DIRECT-STAGE1-V1'
            echo "head-sha=$GITHUB_SHA"
            grep -aE '^(XHCI_PCI_VENDOR|XHCI_PCI_DEVICE|XHCI_BAR0|XHCI_HCIVERSION|XHCI_HCSPARAMS1|XHCI_HCCPARAMS1|XHCI_DBOFF|XHCI_RTSOFF|XHCI_USBCMD|XHCI_USBSTS|XHCI_MFINDEX_[12]|XHCI_CONNECTED_PORTS|XHCI_ENABLED_PORTS)=' "$rt/serial.log" || true
            echo 'result=PASS'
          } > "$rt/result.txt"
          sha256sum "$root/XHCI-STAGE1.EFI" "$rt/serial.log" "$rt/result.txt" > "$rt/hashes.txt"
          echo XHCI_STAGE1_RUNTIME=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-xhci-direct-stage1-v1
          path: |
            boot/uefi-xhci-direct-stage1-v1/XHCI-STAGE1.EFI
            boot/uefi-xhci-direct-stage1-v1/efi.sha256
            boot/uefi-xhci-direct-stage1-v1/runtime/serial.log
            boot/uefi-xhci-direct-stage1-v1/runtime/result.txt
            boot/uefi-xhci-direct-stage1-v1/runtime/hashes.txt
          if-no-files-found: error
