name: CI

on:
  push:
    branches: [main, bootstrap-v0.1]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  uefi:
    name: UEFI x86-64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust UEFI target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-uefi

      - name: Build UEFI executable
        run: cargo build --manifest-path boot/uefi/Cargo.toml --target x86_64-unknown-uefi --release

      - name: Upload EFI executable
        uses: actions/upload-artifact@v4
        with:
          name: accessible-windows-uefi-x86_64
          path: boot/uefi/target/x86_64-unknown-uefi/release/aw-uefi-boot.efi
          if-no-files-found: error
