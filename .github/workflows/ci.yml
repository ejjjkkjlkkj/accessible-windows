name: CI

on:
  push:
    branches: [main, bootstrap-v0.1]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  uefi:
    name: UEFI x86-64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust UEFI target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-uefi

      - name: Build UEFI executable
        run: cargo build --manifest-path boot/uefi/Cargo.toml --target x86_64-unknown-uefi --release

      - name: Install image and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf gdisk dosfstools

      - name: Build GPT/ESP boot disk image
        run: ./scripts/build-uefi-disk.sh

      - name: UEFI disk boot smoke test
        shell: bash
        run: |
          set -euo pipefail

          OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
          OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"
          if [ ! -f "$OVMF_CODE" ] || [ ! -f "$OVMF_VARS" ]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE.fd"
            OVMF_VARS="/usr/share/OVMF/OVMF_VARS.fd"
          fi
          if [ ! -f "$OVMF_CODE" ] || [ ! -f "$OVMF_VARS" ]; then
            echo "No usable OVMF CODE/VARS pair found" >&2
            find /usr/share/OVMF -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "$OVMF_VARS" ovmf-vars.fd

          set +e
          timeout 20s qemu-system-x86_64 \
            -machine q35 \
            -m 256M \
            -display none \
            -serial none \
            -monitor none \
            -no-reboot \
            -debugcon file:uefi-debug.log \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=ovmf-vars.fd \
            -drive format=raw,file=build/accessible-windows-uefi-x86_64.img
          QEMU_STATUS=$?
          set -e

          echo "QEMU_STATUS=$QEMU_STATUS"
          cat uefi-debug.log || true
          grep -F "AW_BOOT_OK stage=uefi_init arch=x86_64" uefi-debug.log
          grep -F "AW_MEMORY_MAP_OK" uefi-debug.log
          grep -F "AW_ACPI_OK" uefi-debug.log
          grep -F "AW_GOP_OK" uefi-debug.log
          grep -F "AW_FRAMEBUFFER_OK" uefi-debug.log

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: accessible-windows-uefi-x86_64
          path: |
            boot/uefi/target/x86_64-unknown-uefi/release/aw-uefi-boot.efi
            build/accessible-windows-uefi-x86_64.img
          if-no-files-found: error
