name: CI

on:
  push:
    branches: [main, bootstrap-v0.1]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Documentation
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  uefi:
    name: UEFI + native x86-64 kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            boot/uefi/target
            kernel/x86_64/target
          key: baremetal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('boot/uefi/Cargo.toml', 'kernel/x86_64/Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install Rust bare-metal targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-uefi x86_64-unknown-none
          rustc -Vv
          cargo -V

      - name: Build and validate relocatable flat kernel
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path kernel/x86_64/Cargo.toml --target x86_64-unknown-none --release
          KERNEL_ELF="kernel/x86_64/target/x86_64-unknown-none/release/aw-kernel-x86_64"
          KERNEL_BIN="${KERNEL_ELF}.bin"

          readelf -hW "$KERNEL_ELF"
          objdump -h "$KERNEL_ELF"
          nm -n "$KERNEL_ELF"

          ELF_TYPE="$(readelf -hW "$KERNEL_ELF" | awk '/Type:/ { print $2; exit }')"
          if [ "$ELF_TYPE" != "EXEC" ]; then
            echo "Kernel ELF must be static ET_EXEC before flattening; got: $ELF_TYPE" >&2
            exit 1
          fi

          START_ADDRESS="$(nm -n "$KERNEL_ELF" | awk '$3 == "_start" { print $1; exit }')"
          TEXT_ADDRESS="$(objdump -h "$KERNEL_ELF" | awk '$2 == ".text" { print $4; exit }')"
          if [ -z "$START_ADDRESS" ] || [ -z "$TEXT_ADDRESS" ] || [ "$START_ADDRESS" != "$TEXT_ADDRESS" ]; then
            echo "Kernel _start must be the first byte of the flattened .text image: start=$START_ADDRESS text=$TEXT_ADDRESS" >&2
            exit 1
          fi

          readelf -rW "$KERNEL_ELF" | tee kernel-relocations.txt
          if grep -Eq 'R_X86_64_' kernel-relocations.txt; then
            echo "Flat kernel still contains runtime relocations" >&2
            exit 1
          fi

          objcopy -O binary "$KERNEL_ELF" "$KERNEL_BIN"
          test -s "$KERNEL_BIN"
          echo "AW_NATIVE_KERNEL_BUILD_OK elf=$KERNEL_ELF bin=$KERNEL_BIN bytes=$(stat -c%s "$KERNEL_BIN") start_vma=0x$START_ADDRESS relocations=none"

      - name: Build UEFI executable
        run: cargo build --manifest-path boot/uefi/Cargo.toml --target x86_64-unknown-uefi --release

      - name: Install image and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf gdisk dosfstools

      - name: Build GPT/ESP boot disk image
        run: ./scripts/build-uefi-disk.sh

      - name: Raw GPT/OVMF boot smoke test
        shell: bash
        run: |
          set -euo pipefail

          OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
          OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"
          if [ ! -f "$OVMF_CODE" ] || [ ! -f "$OVMF_VARS" ]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE.fd"
            OVMF_VARS="/usr/share/OVMF/OVMF_VARS.fd"
          fi
          if [ ! -f "$OVMF_CODE" ] || [ ! -f "$OVMF_VARS" ]; then
            echo "No usable OVMF CODE/VARS pair found" >&2
            find /usr/share/OVMF -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "$OVMF_VARS" ovmf-vars.fd

          set +e
          timeout 20s qemu-system-x86_64 \
            -machine q35 \
            -m 256M \
            -display none \
            -serial none \
            -monitor none \
            -no-reboot \
            -debugcon file:uefi-debug.log \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=ovmf-vars.fd \
            -drive format=raw,file=build/accessible-windows-uefi-x86_64.img
          QEMU_STATUS=$?
          set -e

          echo "QEMU_STATUS=$QEMU_STATUS"
          cat uefi-debug.log || true
          grep -F "AW_BOOT_OK stage=uefi_init arch=x86_64" uefi-debug.log
          grep -F "AW_KERNEL_FILE_READ_OK" uefi-debug.log
          grep -F "AW_NATIVE_KERNEL_LOAD_OK" uefi-debug.log
          grep -F "mode=dynamic_pic" uefi-debug.log
          grep -F "AW_MEMORY_MAP_OK" uefi-debug.log
          grep -F "AW_ACPI_OK" uefi-debug.log
          grep -F "AW_ACPI_VALIDATE_OK" uefi-debug.log
          grep -F "AW_GOP_OK" uefi-debug.log
          grep -F "AW_FRAMEBUFFER_OK" uefi-debug.log
          grep -F "AW_EXIT_BOOT_SERVICES_OK" uefi-debug.log
          grep -F "AW_KERNEL_HANDOFF_OK" uefi-debug.log
          grep -F "AW_NATIVE_KERNEL_TRANSFER" uefi-debug.log
          grep -F "AW_NATIVE_KERNEL_ENTRY_OK" uefi-debug.log
          grep -F "AW_NATIVE_FRAMEBUFFER_WRITE_OK" uefi-debug.log
          grep -F "AW_NATIVE_KERNEL_IDLE" uefi-debug.log

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum \
            boot/uefi/target/x86_64-unknown-uefi/release/aw-uefi-boot.efi \
            kernel/x86_64/target/x86_64-unknown-none/release/aw-kernel-x86_64 \
            kernel/x86_64/target/x86_64-unknown-none/release/aw-kernel-x86_64.bin \
            build/accessible-windows-uefi-x86_64.img \
            uefi-debug.log > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-checksums: SHA256SUMS.txt

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v6
        with:
          name: accessible-windows-uefi-x86_64
          path: |
            boot/uefi/target/x86_64-unknown-uefi/release/aw-uefi-boot.efi
            kernel/x86_64/target/x86_64-unknown-none/release/aw-kernel-x86_64
            kernel/x86_64/target/x86_64-unknown-none/release/aw-kernel-x86_64.bin
            build/accessible-windows-uefi-x86_64.img
            uefi-debug.log
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Boot summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Accessible Windows boot validation"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Runner: \`${RUNNER_OS}/${RUNNER_ARCH}\`"
            echo "- Raw GPT/OVMF boot: see job result above"
            if [ -f SHA256SUMS.txt ]; then
              echo
              echo '```text'
              cat SHA256SUMS.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
