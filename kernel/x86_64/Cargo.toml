[package]
name = "aw-kernel-x86_64"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
aw-acpi = { path = "../../crates/aw-acpi" }
aw-kernel-core = { path = "../../crates/aw-kernel-core" }
aw-memory = { path = "../../crates/aw-memory" }
aw-pci = { path = "../../crates/aw-pci" }
aw-x86-interrupts = { path = "../../crates/aw-x86-interrupts" }
aw-x86-paging = { path = "../../crates/aw-x86-paging" }
aw-x86-platform = { path = "../../crates/aw-x86-platform" }

[features]
exception-smoke-test = []
double-fault-smoke-test = []


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = false
