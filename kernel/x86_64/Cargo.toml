[package]
name = "aw-kernel-x86_64"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
aw-acpi = { path = "../../crates/aw-acpi" }
aw-kernel-core = { path = "../../crates/aw-kernel-core" }
aw-memory = { path = "../../crates/aw-memory" }
aw-pci = { path = "../../crates/aw-pci" }
aw-x86-interrupts = { path = "../../crates/aw-x86-interrupts" }
aw-x86-paging = { path = "../../crates/aw-x86-paging" }
aw-x86-platform = { path = "../../crates/aw-x86-platform" }

[features]
exception-smoke-test = []
double-fault-smoke-test = []
# Brings up one application processor that deliberately double-faults, to prove
# the fault resolves on that CPU's own per-CPU IST1. Test-only.
ap-double-fault-smoke-test = []
# Runs the cooperative scheduler on an application processor, to prove threads
# context switch on a CPU other than the bootstrap processor. Test-only.
ap-scheduler-smoke-test = []
# Writes a sector by DMA through AHCI and reads it back, to prove SATA writes.
# Test-only: it overwrites LBA 0, so it must only ever run against a scratch disk,
# never a boot or data disk. Never enabled in the normal boot path.
ahci-write-smoke-test = []
# Creates a file in a FAT16 filesystem (allocate a cluster, chain the FAT, add the
# directory entry) and reads it back. Test-only, scratch disk only: it modifies the
# filesystem. Never enabled in the normal boot path.
fat-write-smoke-test = []
# Writes a GPT partition table (protective MBR + primary/backup headers with CRC32 +
# an ESP entry) onto a blank disk and reads it back. Test-only, scratch disk only:
# it overwrites the partition table. Never enabled in the normal boot path.
gpt-write-smoke-test = []
# Formats a blank disk as an empty FAT16 volume (boot sector/BPB, two FATs, a zeroed
# root directory), then creates a file in it and reads it back. Test-only, scratch
# disk only: it overwrites the volume. Never enabled in the normal boot path.
fat-format-smoke-test = []
# Drives the MSI delivery proof with QEMU's `edu` test device. Never enabled in
# a shipping image: it contains a driver for a device that only exists inside an
# emulator.
msi-proof-device = []


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = false
