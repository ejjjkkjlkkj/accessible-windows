[workspace]
resolver = "2"
members = [
    "crates/aw-accessibility",
    "crates/aw-kernel-contract",
]
exclude = ["boot/uefi"]

[workspace.package]
edition = "2024"
repository = "https://github.com/ejjjkkjlkkj/accessible-windows"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
