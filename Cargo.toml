[workspace]
resolver = "2"
members = [
    "crates/aw-accessibility",
    "crates/aw-acpi",
    "crates/aw-generation",
    "crates/aw-kernel-contract",
    "crates/aw-kernel-core",
    "crates/aw-memory",
    "crates/aw-pci",
    "crates/aw-vmm-plan",
    "crates/aw-x86-paging",
    "crates/aw-x86-platform",
    "crates/aw-x86-vmm-plan",
]
exclude = ["boot/uefi", "kernel/x86_64", "fuzz"]

[workspace.package]
edition = "2024"
repository = "https://github.com/ejjjkkjlkkj/accessible-windows"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
