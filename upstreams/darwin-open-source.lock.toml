schema = 1
family = "darwin"
source_policy = "all-published-open-components-plus-clean-room-compat"

[apple_open_source_inventory]
repository = "https://github.com/apple-oss-distributions/distribution-macOS.git"
commit = "4e290a9b9d3723c65d2a606223d41eb90ecdbf99"
release = "macOS 26.0 open-source distribution inventory"
usage = "inventory-and-component-level-legal-review"

[required_open_components]
xnu = "https://github.com/apple-oss-distributions/xnu.git"
dyld = "https://github.com/apple-oss-distributions/dyld.git"
libsystem = "https://github.com/apple-oss-distributions/Libsystem.git"
libc = "https://github.com/apple-oss-distributions/Libc.git"
libdispatch = "https://github.com/apple-oss-distributions/libdispatch.git"
security = "https://github.com/apple-oss-distributions/Security.git"

[compatibility_projects]
darling = "https://github.com/darlinghq/darling.git"
objc_runtime = "https://github.com/gnustep/libobjc2.git"
foundation = "https://github.com/gnustep/libs-base.git"
appkit = "https://github.com/gnustep/libs-gui.git"

[clean_room_required]
graphics_bridge = "project:compat/darwin/graphics"
audio_bridge = "project:compat/darwin/audio"
accessibility_bridge = "project:crates/aw-accessibility"
host_broker_bridge = "project:crates/aw-app-compat"

[closure]
walk_all_projects_in_apple_distribution_inventory = true
record_component_tag_and_commit = true
record_component_license = true
record_compatibility_project_commit = true
record_clean_room_implementation_commit = true
generate_sbom = true
generate_source_provenance = true
allow_proprietary_macos_frameworks = false
allow_macos_system_image = false
allow_unlicensed_apple_binary = false

[release_gate]
status = "planned"
source_inventory_verified = false
mach_o_loader_verified = false
cli_compatibility_verified = false
gui_compatibility_verified = false
accessibility_verified = false
reason = "The Apple open-source distribution inventory is pinned, but component-level license review, compatibility-source pins and clean-room framework coverage remain incomplete."
